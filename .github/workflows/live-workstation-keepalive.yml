name: Keep UPGRADE AI PRO live during NSE session

on:
  schedule:
    # GitHub cron is UTC. 03:00–10:55 UTC = 08:30–16:25 IST.
    # Keep the free Render instance warm for morning scanning and all-day
    # monitoring of already-triggered setups.
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-ai-pro-live-keepalive
  cancel-in-progress: true

jobs:
  keep-live:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake and health-check the production workstation
        env:
          LIVE_URL: https://upgrade-ai-pro.onrender.com
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 25 "$LIVE_URL/health")
          echo "$response" | node --input-type=module -e '
            let raw = "";
            for await (const chunk of process.stdin) raw += chunk;
            const health = JSON.parse(raw);
            console.log(JSON.stringify({
              status: health.status ?? health.overallStatus ?? "HEALTH_ENDPOINT_RESPONDED",
              auth: health.auth?.status ?? health.authStatus?.status ?? "NOT_EXPOSED",
              marketSessionOpen: health.marketSessionOpen ?? null,
              schedule: health.schedule ?? null,
              ordersEnabled: health.ordersEnabled ?? false
            }, null, 2));
          '
