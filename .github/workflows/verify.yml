name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install production dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check src/api-access.js
          node --check public/app.js
          node --check src/fyers-market-socket.js
          node --check src/fyers-rest.js
          node --check src/fyers-symbol-master.js
          node --check src/rolling-fno-scanner.js
          node --check src/rolling-fno-strategy-engine.js
          node --check src/option-selection.js
          node --check src/strategy-engine.js
      - run: npm test
